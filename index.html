<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jewish Calendar Dashboard</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2c;--panel2:#122238;--border:#263a53;--text:#f4f7fb;--muted:#9fb0c5;--accent:#f4c95d;--accentSoft:rgba(244,201,93,.13);--good:#65d69b;--warn:#ffbf69;--bad:#ff7b7b;--radius:18px;--gap:16px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app-shell{min-height:100vh;padding:22px;display:flex;flex-direction:column;gap:var(--gap)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:4px 4px 2px}.eyebrow{margin:0 0 5px;color:var(--accent);letter-spacing:.14em;font-size:clamp(.72rem,.9vw,.95rem);font-weight:800}h1{margin:0;font-size:clamp(2rem,4.1vw,4.4rem);line-height:.98;letter-spacing:-.035em}.subtitle{margin:8px 0 0;color:var(--muted);font-size:clamp(.95rem,1.15vw,1.25rem)}.topbar-status{text-align:right;flex:0 0 auto}.clock{font-variant-numeric:tabular-nums;font-size:clamp(2.2rem,4vw,4.4rem);line-height:1;font-weight:800;letter-spacing:-.04em}.status-line{margin-top:7px;display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}.status-dot{width:9px;height:9px;border-radius:999px;background:var(--warn);box-shadow:0 0 0 4px rgba(255,191,105,.1)}.status-dot.ok{background:var(--good);box-shadow:0 0 0 4px rgba(101,214,155,.1)}.status-dot.bad{background:var(--bad);box-shadow:0 0 0 4px rgba(255,123,123,.1)}.error-banner{border:1px solid rgba(255,123,123,.5);background:rgba(255,123,123,.09);color:#ffd1d1;padding:11px 14px;border-radius:12px;font-weight:650}.dashboard-grid{flex:1;display:grid;grid-template-columns:minmax(300px,.9fr) minmax(420px,1.35fr) minmax(340px,1fr);grid-template-areas:"today tefillah zmanim" "candles tefillah zmanim" "upcoming upcoming zmanim";gap:var(--gap);min-height:0}.panel{min-width:0;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--border);border-radius:var(--radius);padding:18px;overflow:hidden;box-shadow:0 14px 38px rgba(0,0,0,.16)}.panel-today{grid-area:today}.panel-tefillah{grid-area:tefillah}.panel-zmanim{grid-area:zmanim}.panel-candles{grid-area:candles}.panel-upcoming{grid-area:upcoming}.panel-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}.panel-heading h2{margin:0;color:var(--accent);font-size:clamp(1rem,1.2vw,1.35rem);text-transform:uppercase;letter-spacing:.075em}.panel-kicker{color:var(--muted);font-size:.78rem;white-space:nowrap}.facts{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:9px 14px}.facts dt{color:var(--muted);font-weight:650}.facts dd{margin:0;text-align:right;font-weight:750;overflow-wrap:anywhere}.calendar-note{margin-top:14px;padding:11px 12px;border-left:3px solid var(--accent);background:var(--accentSoft);border-radius:8px;color:#f8e8b4;line-height:1.4}.tefillah-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tefillah-card{border:1px solid var(--border);background:rgba(4,13,25,.26);border-radius:13px;padding:13px}.tefillah-card h3{margin:0 0 9px;font-size:1.08rem}.tag-list{display:flex;flex-wrap:wrap;gap:7px}.tag{border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.075);color:#e6edf7;font-size:clamp(.78rem,.86vw,.96rem);line-height:1.15}.tag.emphasis{color:#fff0bc;border-color:rgba(244,201,93,.34);background:var(--accentSoft)}.zmanim-list{display:grid;gap:2px}.zman-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(159,176,197,.13)}.zman-row:last-child{border-bottom:0}.zman-label{color:#d7e0eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.zman-time{font-variant-numeric:tabular-nums;font-weight:850;font-size:clamp(1rem,1.25vw,1.4rem)}.zman-row.next{margin:2px -8px;padding:8px;border-radius:9px;background:var(--accentSoft);border-bottom-color:transparent}.zman-row.next .zman-time,.zman-row.next .zman-label{color:#ffe8a5}.stack-list,.event-list{display:grid;gap:10px}.stack-item,.event-item{background:rgba(4,13,25,.26);border:1px solid rgba(159,176,197,.15);border-radius:11px;padding:11px 12px}.stack-item-title,.event-title{font-weight:800}.stack-item-meta,.event-date{color:var(--muted);margin-top:4px;font-size:.88rem;line-height:1.35}.event-list{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.empty-state{color:var(--muted);font-style:italic;padding:6px 0}.footer{display:flex;justify-content:space-between;gap:20px;color:#71849c;font-size:.78rem;padding:0 4px}.footer-right{text-align:right}@media(max-width:1200px){.dashboard-grid{grid-template-columns:1fr 1fr;grid-template-areas:"today tefillah" "zmanim tefillah" "candles upcoming"}}@media(max-width:760px){.app-shell{padding:14px}.topbar{align-items:flex-start}.clock{font-size:2rem}.dashboard-grid{display:flex;flex-direction:column}.tefillah-grid{grid-template-columns:1fr}.footer{flex-direction:column;gap:4px}.footer-right{text-align:left}}@media(min-width:1500px) and (min-height:850px){.app-shell{padding:28px}.panel{padding:22px}.zman-row{padding:10px 0}.facts{gap:12px 18px}}
</style>
<script src="dashboard.js?v=20260813-2" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div>
      <p class="eyebrow">JEWISH CALENDAR DASHBOARD</p>
      <h1 id="hebrew-date">Loading…</h1>
      <p class="subtitle" id="gregorian-date">Connecting to Hebcal</p>
    </div>
    <div class="topbar-status">
      <div class="clock" id="live-clock">--:--:--</div>
      <div class="status-line"><span class="status-dot" id="status-dot"></span><span id="update-status">Starting…</span></div>
    </div>
  </header>

  <div id="error-banner" class="error-banner" hidden></div>

  <main class="dashboard-grid">
    <section class="panel panel-today">
      <div class="panel-heading"><h2>Today</h2></div>
      <dl class="facts" id="today-facts"></dl>
      <div id="calendar-note" class="calendar-note" hidden></div>
    </section>

    <section class="panel panel-tefillah">
      <div class="panel-heading"><h2>Tefillah Modifications</h2><span class="panel-kicker" id="nusach-label"></span></div>
      <div id="tefillah-grid" class="tefillah-grid"></div>
    </section>

    <section class="panel panel-zmanim">
      <div class="panel-heading"><h2>Daily Zmanim</h2></div>
      <div id="zmanim-list" class="zmanim-list"></div>
    </section>

    <section class="panel panel-candles">
      <div class="panel-heading"><h2>Candle Lighting</h2><span class="panel-kicker">Next 3 events</span></div>
      <div id="candle-list" class="stack-list"></div>
    </section>

    <section class="panel panel-upcoming">
      <div class="panel-heading"><h2>Upcoming Events</h2><span class="panel-kicker">Next 30 days</span></div>
      <div id="event-list" class="event-list"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="location-label"></span>
    <span class="footer-right" id="next-refresh">Next API refresh: calculating…</span>
  </footer>
</div>
</body>
</html>
